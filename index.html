<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目事实 · 全景档案</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0eb;--text:#2c2416;--muted:#8b7355;--accent:#8b4513;--card:#faf7f2;--border:#e0d5c7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'Noto Serif SC','STSong',serif;color:var(--text);line-height:1.85;-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(135deg,#5c3317,#8b4513 50%,#a0522d);color:#faf7f2;padding:56px 0 40px;text-align:center}
.header h1{font-size:2rem;font-weight:900;letter-spacing:.05em;margin-bottom:8px}
.header p{font-family:'Noto Sans SC',sans-serif;font-weight:300;font-size:.9rem;opacity:.8}
.container{max-width:720px;margin:0 auto;padding:40px 24px}
.project-list{display:flex;flex-direction:column;gap:16px}
.project-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:24px 28px;transition:box-shadow .2s,border-color .2s}
.project-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.06);border-color:var(--accent)}
.project-card h2{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:6px}
.project-card p{font-family:'Noto Sans SC',sans-serif;font-size:.85rem;color:var(--muted);margin-bottom:12px}
.project-card a{display:inline-block;font-family:'Noto Sans SC',sans-serif;font-size:.8rem;font-weight:500;color:var(--accent);text-decoration:none;padding:4px 14px;border:1px solid var(--accent);border-radius:3px;transition:background .2s,color .2s}
.project-card a:hover{background:var(--accent);color:#faf7f2}
.count{font-family:'Noto Sans SC',sans-serif;font-size:.78rem;color:var(--muted);margin-bottom:20px}
.footer{text-align:center;padding:32px 0;font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);font-family:'Noto Sans SC',sans-serif}
@media(max-width:640px){.header{padding:36px 16px 28px}.header h1{font-size:1.4rem}.container{padding:24px 16px}.project-card{padding:16px 18px}}
</style>
</head>
<body>
<div class="header"><h1>项目事实</h1><p>每个项目当前状态的全景档案 · 不记动作，只记当前状态</p></div>
<div class="container">
<p class="count">共 1 个项目</p>
<div class="project-list">
<div class="project-card">
<h2>大卡鹰眼</h2>
<p>数据工坊 — 重卡物流数据分析平台，提供14个固定分析模板、4个下载模板及企业名称解密工具。</p>
<a href="大卡鹰眼.html">查看详情 →</a>
</div>
</div>
<div class="footer">更新于 2026-06-11</div>
</div>
</body>
</html>
